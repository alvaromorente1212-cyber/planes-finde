<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planes Finde</title>
  <meta name="description" content="Planes con peques para el fin de semana en Rivas, Madrid y alrededores, con opiniones de amigos.">
  <meta name="theme-color" content="#2F7D5B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planes Finde">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/leaflet/MarkerCluster.css">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🛝</span>
      <div>
        <h1>Planes Finde</h1>
        <p class="brand-sub">Con peques, desde Rivas</p>
      </div>
    </div>
    <button class="who" id="whoBtn" type="button" aria-label="Cambiar tu nombre"></button>
  </header>

  <main>
    <!-- PESTAÑA PLANES -->
    <section class="view" id="view-planes" aria-label="Planes">
      <div class="ages-block">
        <h2 class="block-title">¿Qué edad tienen?</h2>
        <div class="ages" id="ages" role="group" aria-label="Edades de los niños"></div>
        <p class="hint" id="agesHint"></p>
      </div>

      <div class="cal" id="calendar"></div>

      <div class="day-head" id="dayHead"></div>

      <div class="filters" id="filters" role="group" aria-label="Filtros"></div>

      <div id="lists"></div>
    </section>

    <!-- PESTAÑA MAPA -->
    <section class="view" id="view-mapa" hidden aria-label="Mapa">
      <div class="map-bar">
        <div class="seg" role="group" aria-label="Qué planes ver en el mapa">
          <button type="button" data-mapmode="dia" class="on">Del día elegido</button>
          <button type="button" data-mapmode="todos">Todos</button>
        </div>
        <p class="map-day" id="mapDay"></p>
      </div>
      <div id="map" role="application" aria-label="Mapa de planes"></div>
      <div class="legend">
        <span><i class="dot dot-temp"></i>Solo estos días</span>
        <span><i class="dot dot-perm"></i>Cualquier finde</span>
        <span><i class="dot dot-rev"></i>Con opiniones</span>
      </div>
    </section>

    <!-- PESTAÑA OPINIONES -->
    <section class="view" id="view-opiniones" hidden aria-label="Opiniones">
      <h2 class="view-title">Lo que ha probado el grupo</h2>
      <div class="filters" id="peopleFilter"></div>
      <div id="feed"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="Secciones">
    <button type="button" data-tab="planes" class="on"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Planes</button>
    <button type="button" data-tab="mapa"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Mapa</button>
    <button type="button" data-tab="opiniones"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Opiniones</button>
  </nav>

  <!-- FICHA DEL PLAN -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="Cerrar">✕</button>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <!-- NOMBRE -->
  <dialog class="name-dialog" id="nameDialog">
    <form method="dialog" id="nameForm">
      <h2>¿Quién eres?</h2>
      <p>Tu nombre aparece en las opiniones para que el grupo sepa quién ha ido.</p>
      <input id="nameInput" name="name" minlength="2" maxlength="40" autocomplete="name" placeholder="Ej.: Álvaro Morente" required>
      <div class="dialog-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/supabase.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet/leaflet.markercluster.js"></script>
  <script src="config.js"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
